<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Educational platform for Students and Teachers with OCR, summaries, handwritten PDF notes, and PPT generation." />
    <meta property="og:title" content="Notivexa AI Portal" />
    <meta property="og:description" content="Educational platform for Students and Teachers with OCR, summaries, handwritten PDF notes, and PPT generation." />
    <script>
      (function() {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.configurable && !desc.writable && !desc.set) {
            var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() { return currentFetch; },
              set: function(v) { currentFetch = v; }
            });
          }
        } catch (err) {
          // Ignore if environment locks property descriptor
        }

        window.addEventListener('error', function(e) {
          var filename = e.filename || '';
          var message = e.message || '';
          var stack = (e.error && e.error.stack) ? String(e.error.stack) : '';
          if (
            filename.indexOf('chrome-extension://') !== -1 ||
            stack.indexOf('chrome-extension://') !== -1 ||
            message.indexOf('Cannot set property fetch') !== -1
          ) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return false;
          }
        }, true);
      })();
    </script>
    <title>Notivexa AI Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Indie+Flower&family=Kalam:wght@300;400;700&family=Shadows+Into+Light&family=Patrick+Hand&display=swap" rel="stylesheet">

  </body>
</html>
