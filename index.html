<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.__app_errors = [];
      window.addEventListener('error', function(e) {
        window.__app_errors.push({
          message: e.message,
          filename: e.filename,
          lineno: e.lineno,
          colno: e.colno,
          error: e.error ? (e.error.stack || e.error.toString()) : String(e)
        });
      });
      window.addEventListener('unhandledrejection', function(e) {
        window.__app_errors.push({
          type: 'unhandledrejection',
          reason: e.reason ? (e.reason.stack || e.reason.toString()) : String(e.reason)
        });
      });
    </script>
    <title>Edusmart AI Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Indie+Flower&family=Kalam:wght@300;400;700&family=Shadows+Into+Light&family=Patrick+Hand&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
